<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Archi Fashion</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Icons (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>

    <!-- Navigation -->
    <nav id="navbar" class="navbar solid">
        <div class="nav-container">
            <div class="nav-mobile-toggle" id="mobile-toggle">
                <i class="ph ph-list"></i>
            </div>
            
            <a href="./index.html" class="nav-brand">
                <h1>Archi Fashion</h1>
                <span>TRADITION REIMAGINED</span>
            </a>
            
            <ul class="nav-links" id="nav-links">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./index.html#sarees">Sarees</a></li>
                <li><a href="./index.html#lehengas">Lehengas</a></li>
                <li><a href="./index.html#kurtas">Kurtas</a></li>
                <li><a href="./index.html#bridal">Bridal</a></li>
            </ul>
            
            <div class="nav-icons">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Theme"><i class="ph ph-moon"></i></button>
                <a href="./profile.html#wishlist" aria-label="Wishlist"><i class="ph ph-heart"></i></a>
                <a href="./profile.html#cart" aria-label="Cart" class="cart-icon">
                    <i class="ph ph-shopping-bag"></i>
                    <span class="cart-badge">0</span>
                </a>
                <a href="./profile.html" aria-label="User Profile" id="login-btn" class="hidden"><i class="ph ph-user"></i></a>
                <div id="user-profile" class="user-profile">
                    <img id="user-avatar" src="" alt="Profile" referrerpolicy="no-referrer">
                    <span id="user-name-display"></span>
                    <button id="logout-btn" class="logout-btn"><i class="ph ph-sign-out"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container container" style="padding-top: 120px; min-height: 80vh;">
        <div class="profile-header" style="text-align: center; margin-bottom: 40px;">
            <img id="profile-page-avatar" src="" alt="Avatar" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--secondary-color); margin-bottom: 15px;">
            <h2 id="profile-page-name" style="font-family: var(--font-heading); margin-bottom: 5px;">User Name</h2>
            <p id="profile-page-email" style="color: var(--text-light);"></p>
        </div>

        <div class="profile-tabs" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; border-bottom: 1px solid var(--border-color);">
            <button class="tab-btn active" data-target="orders-tab" style="padding: 10px 20px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-family: var(--font-heading); font-size: 1.1rem; color: var(--text-color);">My Orders</button>
            <button class="tab-btn" data-target="wishlist-tab" style="padding: 10px 20px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-family: var(--font-heading); font-size: 1.1rem; color: var(--text-color);">Wishlist</button>
            <button class="tab-btn" data-target="cart-tab" style="padding: 10px 20px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-family: var(--font-heading); font-size: 1.1rem; color: var(--text-color);">My Cart</button>
        </div>

        <div class="profile-content">
            <!-- Orders Tab -->
            <div id="orders-tab" class="tab-content active">
                <h3 style="margin-bottom: 20px;">Previous Purchases</h3>
                <div id="orders-list">
                    <p>Loading orders...</p>
                </div>
            </div>

            <!-- Wishlist Tab -->
            <div id="wishlist-tab" class="tab-content hidden">
                <h3 style="margin-bottom: 20px;">Liked Products</h3>
                <div id="wishlist-grid" class="product-grid">
                    <p>Loading wishlist...</p>
                </div>
            </div>

            <!-- Cart Tab -->
            <div id="cart-tab" class="tab-content hidden">
                <h3 style="margin-bottom: 20px;">Items in Bag</h3>
                <div class="cart-layout" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">
                    <div id="cart-items">
                        <p>Loading cart...</p>
                    </div>
                    <div class="cart-summary" style="background: var(--bg-white); padding: 30px; border-radius: 8px; box-shadow: var(--shadow-sm); height: fit-content;">
                        <h4 style="margin-bottom: 20px; font-family: var(--font-heading);">Order Summary</h4>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                            <span>Subtotal</span>
                            <span id="cart-subtotal">$0.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div style="border-top: 1px solid var(--border-color); margin: 20px 0;"></div>
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Delivery Address *</label>
                            <textarea id="checkout-address" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; resize: vertical; min-height: 60px;" placeholder="Enter your full address"></textarea>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Phone Number *</label>
                            <input type="tel" id="checkout-phone" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px;" placeholder="e.g. +91 9876543210">
                        </div>
                        <div style="border-top: 1px solid var(--border-color); margin: 20px 0;"></div>
                        <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 1.2rem; margin-bottom: 30px;">
                            <span>Total</span>
                            <span id="cart-total">$0.00</span>
                        </div>
                        <button id="checkout-btn" class="btn btn-primary" style="width: 100%;">Proceed to Checkout</button>
                        <button id="whatsapp-share-btn" class="btn btn-secondary" style="width: 100%; margin-top: 10px; background-color: #25D366; color: white; border-color: #25D366; display: flex; justify-content: center; align-items: center; gap: 8px;">
                            <i class="ph ph-whatsapp-logo" style="font-size: 1.2rem;"></i> Share on WhatsApp
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./main.js"></script>
    <script type="module" src="./profile.js"></script>
</body>
</html>
