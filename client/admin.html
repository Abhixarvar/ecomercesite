<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Archi Fashion</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        body { background-color: var(--bg-light); padding: 40px 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: var(--bg-white); padding: 40px; border-radius: 12px; box-shadow: var(--shadow-md); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .admin-header h1 { font-family: var(--font-heading); color: var(--primary-color); }
        .back-link { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: var(--font-body); }
        .add-btn { background: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: var(--font-body); transition: var(--transition); }
        .add-btn:hover { background: var(--primary-hover); }

        .products-table { width: 100%; border-collapse: collapse; margin-top: 40px; }
        .products-table th, .products-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .products-table th { font-weight: 600; color: var(--text-muted); }
        .products-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .delete-btn { color: #d9534f; background: none; border: none; cursor: pointer; font-size: 1.2rem; }

        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: white; padding: 40px; border-radius: 8px; text-align: center; }
        .auth-box input { padding: 10px; margin-bottom: 15px; width: 100%; border: 1px solid #ccc; border-radius: 4px; }
        .auth-box button { padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title" style="margin-bottom:20px; font-family:var(--font-heading)">Verifying Access...</h2>
            <p id="auth-message" style="margin-bottom:20px; color:var(--text-muted);">Please wait while we check your credentials.</p>
            <a href="./index.html" id="auth-return-btn" style="display:none; padding: 10px 20px; background: var(--primary-color); color: white; border-radius: 4px; text-decoration: none;">Return to Store</a>
        </div>
    </div>

    <div class="admin-container hidden" id="admin-dashboard">
        <div class="admin-header">
            <h1>Archi Fashion Admin</h1>
            <a href="./index.html" class="back-link"><i class="ph ph-arrow-left"></i> Back to Store</a>
        </div>

        <h3>Add New Product</h3>
        <form id="add-product-form" style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Product Title</label>
                <input type="text" id="p-title" required placeholder="e.g. Red Silk Saree">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="p-category" required>
                    <option value="Sarees">Sarees</option>
                    <option value="Lehengas">Lehengas</option>
                    <option value="Menswear">Menswear</option>
                    <option value="Bridal Wear">Bridal Wear</option>
                    <option value="Kurtas">Kurtas</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="p-price" required min="0" placeholder="e.g. 15000">
            </div>
            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" id="p-stock" required min="0" placeholder="e.g. 10">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Image Upload</label>
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <div style="grid-column: 1 / -1;">
                <button type="submit" class="add-btn">Add Product</button>
            </div>
        </form>

        <h3 style="margin-top: 50px;">Current Stock</h3>
        <table class="products-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="products-tbody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <script type="module" src="./admin.js"></script>
</body>
</html>
